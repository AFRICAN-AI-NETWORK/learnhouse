[project]
description = "Learnhouse Backend"
name = "learnhouse-api"
version = "0.1.0"
requires-python = ">=3.12.3,<3.13.0"
authors = [
    {name = "Badr B. (swve)"}
]
dependencies = [
    "boto3>=1.34.79",
    "botocore>=1.34.93",
    "faker>=30.1.0",
    "fastapi>=0.115.0",
    "fastapi-jwt-auth>=0.5.0",
    "PyJWT>=1.7.1,<2.0.0",
    "httpx>=0.27.0",
    "openai>=1.50.2",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.9",
    "pydantic[email]>=1.8.0,<2.0.0",
    "pytest>=8.2.2",
    "pytest-cov>=4.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.30",
    "pyyaml>=6.0.1",
    "redis>=5.0.7",
    "requests>=2.32.3",
    "resend>=2.4.0",
    "sqlmodel>=0.0.19",
    "tiktoken>=0.7.0",
    "uvicorn==0.30.1",
    "typer>=0.12.5",
    "alembic>=1.13.2",
    "alembic-postgresql-enum>=1.2.0",
    "sqlalchemy-utils>=0.41.2",
    "python-jose>=3.3.0",
    "logfire[sqlalchemy]>=3.8.0",
    "beautifulsoup4>=4.13.4",
    "pytest-asyncio>=1.1.0",
    "grpcio>=1.76.0",
    "apscheduler>=3.11.2",
    "cryptography>=50.0.0",
    "pypdf>=6.14.2",
    "google-generativeai>=0.8.6",
    "websockets>=14.0",
    "google-api-python-client>=2.190.0",
    "google-auth>=2.48.0",
    "google-auth-oauthlib>=1.3.0",
    "google-auth-httplib2>=0.3.0",
    "sentry-sdk[fastapi,sqlalchemy,logging]>=2.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
]

[tool.ruff]
lint.ignore = ["E501", "E712", "E402", "F403", "B008", "EXE001", "PLR1704", "SIM102", "S110", "SIM103", "PLW0602", "C408", "RUF013", "FURB162", "ASYNC230", "ASYNC251", "TRY002", "PLW0127", "PLW0128", "D419", "UP045", "PLR0913", "PLR2004", "TRY401", "PLW1510", "B018", "G202", "PERF402", "DTZ005", "G201", "G004", "RUF002", "RUF003", "RUF059"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "asyncio: mark test as async",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore:.*crypt.*deprecated.*",
    "ignore:.*utcnow.*deprecated.*",
    "ignore:.*obj.dict.*deprecated.*",
    "ignore:.*Instrumentation will have no effect.*",
    "ignore:.*handler names should be lower-case.*",
]

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "ruff>=0.14.14",
]

[tool.uv]
override-dependencies = [
    "pyjwt>=2.13.0",
    "soupsieve>=2.8.4",
    "httplib2>=0.32.0",
]
