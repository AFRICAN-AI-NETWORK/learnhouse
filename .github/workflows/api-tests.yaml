name: API Tests
permissions:
  contents: read
on:
  push:
    branches:
      - dev
    paths:
      - "apps/api/**"
  pull_request:
    paths:
      - "apps/api/**"
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: learnhouse
          POSTGRES_PASSWORD: learnhouse
          POSTGRES_DB: learnhouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: latest

      - name: Install dependencies
        run: |
          cd apps/api
          uv sync

      - name: Run tests
        run: |
          cd apps/api
          uv run pytest src/tests/ -v --tb=short
        env:
          TESTING: "true"
          LEARNHOUSE_SQL_CONNECTION_STRING: postgresql://learnhouse:learnhouse@localhost:5432/learnhouse
          LEARNHOUSE_REDIS_CONNECTION_STRING: redis://localhost:6379/0

      - name: Run security tests with coverage
        run: |
          cd apps/api
          uv run pytest src/tests/security/ --cov=src.security --cov-report=html --cov-report=term-missing
        env:
          TESTING: "true"
          LEARNHOUSE_SQL_CONNECTION_STRING: postgresql://learnhouse:learnhouse@localhost:5432/learnhouse
          LEARNHOUSE_REDIS_CONNECTION_STRING: redis://localhost:6379/0

      - name: Upload coverage report to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/api/htmlcov/
          retention-days: 30
