name: App Build

on:
  push:
    branches:
      - dev
    paths:
      - "**"
  pull_request:
    paths:
      - "**"

# Default permissions
permissions:
  contents: read # PRs and workflow can read repo contents
  # packages write only enabled in jobs that require it

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: app

jobs:
  build:
    name: Build ${{ matrix.config.platform }}
    runs-on: ${{ matrix.config.runner }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm64
    steps:
      - uses: actions/checkout@v3

      # QEMU not needed - using native ARM64 runners for ARM builds

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      # Conditional login: only push if this is a dev branch push
      - name: Log in to GitHub Container Registry (push only on dev)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA and branch info
        id: vars
        env:
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_EVENT_NAME_VALUE: ${{ github.event_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          GITHUB_PR_NUMBER_VALUE: ${{ github.event.pull_request.number }}
          GITHUB_HEAD_REF_VALUE: ${{ github.head_ref }}
        run: |
          # Validate the SHA is not empty
          if [ -z "$GITHUB_SHA_VALUE" ]; then
            echo "Error: github.sha is empty. Cannot proceed with build."
            exit 1
          fi

          SHORT=$(printf '%s' "$GITHUB_SHA_VALUE" | cut -c1-7)
          echo "short=$SHORT" >> $GITHUB_OUTPUT

          if [ "$GITHUB_EVENT_NAME_VALUE" = "push" ] && [ "$GITHUB_REF_VALUE" = "refs/heads/dev" ]; then
            echo "branch=dev" >> $GITHUB_OUTPUT
            echo "tag_prefix=dev" >> $GITHUB_OUTPUT
          else
            echo "branch=pr" >> $GITHUB_OUTPUT
            # Handle empty PR number gracefully
            PR_NUMBER="$GITHUB_PR_NUMBER_VALUE"
            if [ -z "$PR_NUMBER" ]; then
              # Fallback to branch name or generic identifier
              BRANCH_NAME="$GITHUB_HEAD_REF_VALUE"
              if [ -z "$BRANCH_NAME" ]; then
                PR_NUMBER="unknown"
              else
                # Use sanitized branch name (replace / with -)
                PR_NUMBER=$(echo "$BRANCH_NAME" | tr '/' '-')
              fi
            fi
            echo "tag_prefix=pr-$PR_NUMBER" >> $GITHUB_OUTPUT
          fi
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.short }}-${{ matrix.config.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
            type=raw,value=${{ steps.vars.outputs.tag_prefix }}-${{ matrix.config.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
            type=raw,value=${{ steps.vars.outputs.tag_prefix }}-${{ steps.vars.outputs.short }}-${{ matrix.config.platform == 'linux/amd64' && 'amd64' || 'arm64' }}

      - name: Build Docker image (push only on dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.config.platform }}
          cache-from: type=gha,scope=${{ matrix.config.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.config.platform }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            LEARNHOUSE_PUBLIC=true

  manifest:
    name: Create and push manifest
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA and branch info
        id: vars
        run: |
          # Validate github.sha is not empty
          if [ -z "${{ github.sha }}" ]; then
            echo "Error: github.sha is empty. Cannot proceed with manifest creation."
            exit 1
          fi

          echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "tag_prefix=dev" >> $GITHUB_OUTPUT

      - name: Extract metadata for manifest
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.short }}
            type=raw,value=${{ steps.vars.outputs.tag_prefix }}
            type=raw,value=${{ steps.vars.outputs.tag_prefix }}-${{ steps.vars.outputs.short }}
            type=raw,value=latest

      - name: Create and push manifest list
        run: |
          SHORT_SHA="${{ steps.vars.outputs.short }}"
          TAG_PREFIX="${{ steps.vars.outputs.tag_prefix }}"
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"

          # Create manifest list for each tag
          for TAG in "$SHORT_SHA" "$TAG_PREFIX" "${TAG_PREFIX}-${SHORT_SHA}"; do
            docker buildx imagetools create --tag "${IMAGE}:${TAG}" \
              "${IMAGE}:${TAG}-amd64" \
              "${IMAGE}:${TAG}-arm64"
          done

          # Create latest tag if on dev branch
          docker buildx imagetools create --tag "${IMAGE}:latest" \
            "${IMAGE}:${SHORT_SHA}-amd64" \
            "${IMAGE}:${SHORT_SHA}-arm64"

  dispatch:
    name: Repository Dispatch
    needs: manifest
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Sentry release
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          version: ${{ github.sha }}

      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.TRIGGER_PAT_TOKEN }}
          repository: learnhouse/images
          event-type: build-images
          client-payload: |
            {
              "ref": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}"
            }
