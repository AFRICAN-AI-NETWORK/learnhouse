name: Web Offline / PWA

# Guards the offline subsystem. A broken service worker does not fail loudly at
# runtime — it silently degrades or strands users on a stale cache — so these
# checks are build gates rather than monitoring concerns.

permissions:
  contents: read

on:
  push:
    branches:
      - dev
    paths:
      - "apps/web/**"
  pull_request:
    paths:
      - "apps/web/**"

jobs:
  unit-tests:
    name: Offline unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./apps/web

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: ./apps/web

      - name: Run tests
        run: pnpm run test -- --ci
        working-directory: ./apps/web

  pwa-build:
    name: Service worker build gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./apps/web

      - name: Build
        run: pnpm run build
        working-directory: ./apps/web
        env:
          # Every replica must serve an identical precache manifest, or a
          # load-balanced user can be handed a worker that disagrees with the
          # assets they already have cached.
          BUILD_ID: ${{ github.sha }}
          NEXT_PUBLIC_LEARNHOUSE_API_URL: https://ci.invalid/api/v1
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify service worker output
        run: node scripts/verify-pwa-build.mjs
        working-directory: ./apps/web
        env:
          CI: "true"

      - name: Check bundle size budget
        run: node scripts/check-bundle-size.mjs
        working-directory: ./apps/web

      - name: Upload service worker artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-worker
          path: |
            apps/web/public/sw.js
            apps/web/public/worker-*.js
            apps/web/public/workbox-*.js
          retention-days: 7

  e2e:
    name: Offline end-to-end
    runs-on: ubuntu-latest
    # Opt-in: the suite needs seeded credentials and a reachable API, which are
    # not available on every PR. Run it on demand or on a deployed preview.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./apps/web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ./apps/web

      - name: Build
        run: pnpm run build
        working-directory: ./apps/web
        env:
          BUILD_ID: ${{ github.sha }}
          NEXT_PUBLIC_OFFLINE_READ_ENABLED: "true"
          NEXT_PUBLIC_OFFLINE_WRITE_ENABLED: "true"

      - name: Run offline suite
        run: npx playwright test
        working-directory: ./apps/web
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
          E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
          E2E_COURSE_UUID: ${{ secrets.E2E_COURSE_UUID }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
