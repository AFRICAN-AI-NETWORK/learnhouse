[mypy]
python_version = 3.12

# Lenient settings for legacy codebase with SQLModel/SQLAlchemy
# This allows the code to pass while still catching actual type violations
no_implicit_optional = False
ignore_missing_imports = True
follow_imports = silent
warn_unused_configs = False
explicit_package_bases = True

# Disable strict checking on common patterns in this codebase
disallow_untyped_defs = False
disallow_untyped_calls = False
disallow_incomplete_defs = False
check_untyped_defs = False
warn_incomplete_stub = False
warn_redundant_casts = False
warn_unused_ignores = False
warn_return_any = False

# Allow assignments from Any (common with SQLModel/SQLAlchemy ORM)
warn_unreachable = False
no_error_summary = False
